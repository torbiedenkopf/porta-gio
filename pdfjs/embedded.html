<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PDF.js Embedded</title>

<style>

html,
body{
    margin:0;
    padding:0;
    background:#ffffff;
    overflow:hidden;
}

#viewer{

    width:100%;
    box-sizing:border-box;

}

.pdf-page{

    display:block;
    margin:0 auto 16px auto;
    background:white;

}

#error{

    display:none;

    padding:20px;

    color:#b00020;

    font-family:Arial,sans-serif;

    font-size:16px;

}

</style>

</head>

<body>

<div id="viewer"></div>

<div id="error"></div>

<script type="module" src="./embedded.js"></script>

</body>

</html>
